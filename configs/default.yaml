# Central configuration. Every random process is seeded from `seed`.
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  sample: data/sample
  models: models
  reports: reports

data:
  n_tenants: 10              # one per industry
  mailboxes_per_tenant: 30
  start_date: 2026-06-01
  days: 60                   # whole stream; features only ever look at earlier emails
  n_emails: 10000
  label_noise: 0.02
  class_mix:                 # fraction of labelled emails
    legit: 0.78
    spam: 0.08
    phishing: 0.06
    bec: 0.04
    malware: 0.04
  test_days: 12              # last 12 days (20%) are the time-based test set

# Mocked external services. Latency is lognormal around p50 with a hard client timeout.
services:
  ip_reputation:  { p50_ms: 4,    sigma: 0.5, timeout_ms: 50 }
  whois:          { p50_ms: 8,    sigma: 0.6, timeout_ms: 80 }
  url_reputation: { p50_ms: 6,    sigma: 0.5, timeout_ms: 60 }
  virus_scan:     { p50_ms: 2500, sigma: 0.9, timeout_ms: 60000 }   # async path only

# Cascade
cascade:
  sync_deadline_ms: 5000     # provider fail-open deadline
  target_p99_ms: 2000
  gray_zone: [0.30, 0.80]    # Tier 1 scores sent to the intent check (re-tuned in eval)

model:
  warmup_days: 7             # history-only: senders all look "new" at the start of the stream
  lgbm:                      # picked on a validation window (last 7 train days), never on test
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 40
    reg_lambda: 5.0
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
