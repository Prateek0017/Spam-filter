# Central configuration. Every random process is seeded from `seed`.
seed: 42

paths:
  raw: data/raw
  processed: data/processed
  sample: data/sample
  models: models
  reports: reports

data:
  n_tenants: 10              # one per industry
  mailboxes_per_tenant: 30
  start_date: 2026-06-01
  days: 60                   # whole stream; features only ever look at earlier emails
  n_emails: 10000
  label_noise: 0.02
  class_mix:                 # fraction of labelled emails
    legit: 0.78
    spam: 0.08
    phishing: 0.06
    bec: 0.04
    malware: 0.04
  test_days: 12              # last 12 days (20%) are the time-based test set

# Mocked external services. Latency is lognormal around p50 with a hard client timeout.
services:
  ip_reputation:  { p50_ms: 4,    sigma: 0.5, timeout_ms: 50 }
  whois:          { p50_ms: 8,    sigma: 0.6, timeout_ms: 80 }
  url_reputation: { p50_ms: 6,    sigma: 0.5, timeout_ms: 60 }
  virus_scan:     { p50_ms: 2500, sigma: 0.9, timeout_ms: 60000 }   # async path only

# Cascade
cascade:
  sync_deadline_ms: 5000     # provider fail-open deadline
  target_p99_ms: 2000
  gray_zone: [0.30, 0.80]    # LightGBM P(malicious) in this band goes to the Tier 2 intent check
                             # (lower bound picked on the validation window, see DESIGN.md)
  topic_shift_high: 0.8      # 1 - cosine to the sender's past emails (weak signal: legit median ~0.7)
  intent_min: 0.5            # intent probability that counts as "asks for"

model:
  warmup_days: 7             # history-only: senders all look "new" at the start of the stream
  lgbm:                      # picked on a validation window (last 7 train days), never on test
    n_estimators: 150
    learning_rate: 0.05
    num_leaves: 15
    min_child_samples: 40
    reg_lambda: 5.0
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8

# Cost model for the $0.30/mailbox/month budget. Volumes and prices are assumptions, stated
# so they can be challenged; measured compute time and lookup counts come from the eval run.
cost:
  budget_per_mailbox_month: 0.30
  emails_per_mailbox_day: 5            # base case: the assignment's volume (30 mailboxes per customer)
  stress_emails_per_mailbox_day: 120   # stress test: a heavy business inbox (Radicati, see README)
  vcpu_hour_usd: 0.04                  # on-demand ARM vCPU
  cpu_overhead: 3.0                    # MIME parsing, queueing, retries on top of measured compute
  lookup_cache_hit: 0.90               # IP / WHOIS / URL answers cached for hours
  lookup_usd: 0.0001                   # per uncached reputation / WHOIS call
  scan_cache_hit: 0.50                 # attachment hash already scanned (shared across tenants)
  av_usd: 0.00005                      # self-hosted static AV, every attachment
  sandbox_usd: 0.002                   # detonation sandbox: risky types on non-quarantined mail only
